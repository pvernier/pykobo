[project]
name = "pykobo"
version = "0.1.7"
description = "A Python module to fetch data from the Kobo API"
authors = [{ name = "pvernier", email = "pvernier82@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "requests>=2.28",
]

[project.urls]
Repository = "https://github.com/pvernier/pykobo"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "flake8>=7.0",
    "black>=24.0",
    "isort>=5.13",
    "safety>=3.0",
    "bandit>=1.7",
    "pre-commit>=4.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pykobo"]

[tool.black]
target-version = ["py310", "py311", "py312"]
